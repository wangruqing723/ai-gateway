name: Docker Build & Publish (Go)

on:
  # 推送到 master 时自动构建并推送
  push:
    branches: [master]
    tags:
      - 'v*'        # 推送版本标签时也触发（如 v1.0.0）
    paths-ignore:
      - '*.md'
  # PR 时只构建验证，不推送
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
  # 允许手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Validate vendored web runtime
        shell: bash
        run: |
          printf '%s  %s\n' \
            '3ed1eed252488921df65e363d6715deb04d7f92aaedb9e52199fdf73cb1e0ad3' 'cmd/gateway/web/vendor/alpine.min.js' \
            '176e894661aa9cdc9a5cba6c720044cbbf7b8bd80d1c9a142a7c24b1b6c50d15' 'cmd/gateway/web/vendor/tailwindcss.js' \
            | sha256sum --check -
          node --check cmd/gateway/web/vendor/alpine.min.js
          node --check cmd/gateway/web/vendor/tailwindcss.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('cmd/gateway/web/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          if (scripts.length === 0) throw new Error('expected at least one inline script');
          scripts.forEach((script, index) => {
            try {
              new Function(script);
            } catch (error) {
              throw new Error(`inline script ${index + 1} is invalid: ${error.message}`);
            }
          });
          NODE

      - name: Validate production Compose
        run: docker compose config --quiet

      - name: Validate development Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 登录 GHCR（仅非 PR 时登录）
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 设置 QEMU（支持多平台构建）
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 生成镜像标签
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 推送到 master → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 推送 v1.2.3 标签 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 每次构建带 short SHA
            type=sha,prefix=

      # 构建并推送（PR 时只构建不推送）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
