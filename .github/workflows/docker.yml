name: Docker Build & Publish (Go)

on:
  # 推送到 master 时自动构建并推送
  push:
    branches: [master]
    tags:
      - 'v*'        # 推送版本标签时也触发（如 v1.0.0）
    paths-ignore:
      - '*.md'
  # PR 时只构建验证，不推送
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
  # 允许手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Validate vendored web runtime
        shell: bash
        run: |
          printf '%s  %s\n' \
            '3ed1eed252488921df65e363d6715deb04d7f92aaedb9e52199fdf73cb1e0ad3' 'cmd/gateway/web/vendor/alpine.min.js' \
            | sha256sum --check -
          node --check cmd/gateway/web/vendor/alpine.min.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('cmd/gateway/web/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          if (scripts.length === 0) throw new Error('expected at least one inline script');
          scripts.forEach((script, index) => {
            try {
              new Function(script);
            } catch (error) {
              throw new Error(`inline script ${index + 1} is invalid: ${error.message}`);
            }
          });
          NODE

      # 样式表是构建期产物且随仓库提交，于是多了一种新的失步方式：
      # 改了 index.html 的 class 却忘了重跑 `make web-css`，产物里就没有对应规则，
      # 页面会静默少一块样式。这里用固定版本重建一次并比对，把「忘了重建」变成 CI 失败。
      - name: Verify built stylesheet is up to date
        shell: bash
        run: |
          cd cmd/gateway/web
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i src/tailwind.css -o /tmp/tailwind-rebuilt.css -m
          if ! diff -q /tmp/tailwind-rebuilt.css vendor/tailwind.css; then
            echo '::error::vendor/tailwind.css 与源文件不一致，请重跑 `make web-css` 后提交产物'
            diff -u vendor/tailwind.css /tmp/tailwind-rebuilt.css | head -60
            exit 1
          fi

      # index.html 同样是随仓库提交的构建产物（由 web/src 下的模板与片段拼成），
      # 与样式表一样存在「改了片段忘了重建」的失步风险。-check 只比对不写盘。
      - name: Verify built index.html is up to date
        run: go run ./cmd/webbuild -check

      - name: Validate production Compose
        run: docker compose config --quiet

      - name: Validate development Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v7

      # 登录 GHCR（仅非 PR 时登录）
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 设置 QEMU（支持多平台构建）
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      # 设置 Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 生成镜像标签
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 推送到 master → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 推送 v1.2.3 标签 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 每次构建带 short SHA
            type=sha,prefix=

      # 构建并推送（PR 时只构建不推送）
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
