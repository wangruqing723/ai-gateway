port: 7789
# host: "127.0.0.1"     # 默认仅监听本地（Docker 环境请改为 "0.0.0.0"）
# 非静态请求还会校验 Host：放行 loopback、此处配置的 host；配置为 0.0.0.0/:: 时放行 IP 字面量。
# 通过反向代理访问时请保留本机 Host，或把代理使用的域名配置为 host；不要依赖任意域名放行。

# ── 请求配置 ──────────────────────────────────────────────
timeout: 120000        # 请求超时（毫秒），默认 120 秒（1000-300000）
streamActivityTimeout: 60000   # 流式活跃超时（毫秒），流式响应超过此时间无新数据则主动断开，默认 60 秒（5000-600000）

# ── 直通模式（direct mode，可选）─────────────────────────────
# 开启后请求不进队列：跳过并发控制、限速(maxPerSecond)与排队等待(maxQueueWait)，
# 直接转发到上游。适合个人自用、希望“能发就发、被上游限额就直接返回”的场景。
# 限流由上游自己用 HTTP 429 处理（网关原样透传，不重试、不排队）。仅保留下面的超时保护。
# 默认关闭；不写这些字段即为关闭，保持队列行为。
directMode: false
# 直通模式下的三类超时（毫秒），仅 directMode: true 时生效：
directTimeoutNoStream: 60000      # 非流式整体超时，1000-300000
directTimeoutStreamHeader: 60000  # 流式响应头超时，1000-300000
directTimeoutStreamActive: 120000 # 流式活跃超时，5000-600000

# ── 故障转移（failover，可选）─────────────────────────────────
# 给路由配多个候选目标（见下方 routes 的 targets 写法）后，某个候选失败时
# 自动换下一个候选重试。默认关闭；不写这个字段即为关闭，行为与单目标完全一致。
#
# 注意最坏耗时：每个候选各自享有完整的队列等待与超时预算，
# maxAttempts: 2 且 maxQueueWait: 30000 + timeout: 120000 时，
# 最坏情况客户端要等约 2 × 150 秒。候选数与各档超时要一起算。
#
# 转移只发生在「尚未向客户端写出任何字节」之前。流式响应一旦开始下发 SSE
# 就不再转移（已发出的字节无法回收），中途失败仍补合规收尾事件。
failover:
  enabled: false          # 总开关，默认 false
  maxAttempts: 2          # 单个请求最多尝试几个候选（1-5，默认 2）
  # 429 的 Retry-After 超过此值时，该候选「不消耗尝试额度」——
  # 上游明确说了这段时间不可用，那这次失败不该占掉 maxAttempts 里的一格，
  # 否则一个自曝限流的上游会挤掉本来还能试的健康候选（与熔断跳过同等待遇）。
  # 范围 0-60000，默认 5000；显式写 0 表示不设上限（所有 429 照常消耗额度）。
  maxRetryAfterMs: 5000
  # 下面几项控制哪些失败允许转移，不写则用括号内默认值：
  onTransportError: true       # 连接失败、上游不可达（默认 true）
  onServerError: true          # 上游 5xx（默认 true）
  onRateLimit: true            # 上游 429（默认 true）
  onQueueTimeout: true         # 本地排队等待超时（默认 true）
  onStreamHeaderTimeout: true  # 流式等响应头超时，此时客户端还没收到字节（默认 true）
  # 非流式整体超时（默认 false）。开启后总耗时会接近翻倍（timeout × 候选数），
  # 因为每个候选都要等满一整个 timeout 预算。单独一个开关而不并入
  # onTransportError：后者覆盖的连接失败几乎不耗时，是 failover 最该管的场景，
  # 不该为了关掉超时转移把它一起关掉。
  # 流式活跃超时不可配置转移：那时字节已写给客户端，重发会污染流。
  onRequestTimeout: false
  onAuthError: false           # 上游 401/403（默认 false：key 配错时转移只会连锁失败并掩盖真实原因）

# ── 熔断（breaker，可选）──────────────────────────────────────
# 连续失败的 provider 会被暂时摘掉，后续请求直接跳过它换下一个候选，
# 不必每次都等它超时。默认关闭；不写这个字段即为关闭。
#
# 判据只认「上游真的坏了」：传输错误、超时、5xx 计入失败；
# 429 不计（上游正常限流，交给 failover 的 Retry-After 处理），
# 401/403 不计（配置问题，熔断修不了还会掩盖密钥过期），
# 本地队列超时不计（网关侧背压，与上游健康无关）。
#
# 状态机：closed →（连续失败达阈值）→ open →（冷却结束）→ half_open →（探测结果）→ closed / open。
# 半开探针直接用下一个真实入站请求，不额外探 /v1/models —— 那个端点通了不代表聊天端点可用。
#
# 被熔断跳过的候选不消耗 failover 的 maxAttempts 额度，否则熔断反而会削弱可用性。
# 全部候选都在熔断中时返回 503 + retry-after（取最早恢复者的剩余冷却）。
# 状态可在 /health 的 breakers 字段查看，手动闭合用 POST /api/providers/breaker/reset[?provider=名字]。
#
# 下面三项写 0 会直接报错而不是被当成「没写」：不写才用默认值。
breaker:
  enabled: false            # 总开关，默认 false
  consecutiveFailures: 3    # 连续失败多少次打开熔断（1-100，默认 3）
  openMs: 30000             # 打开后的冷却毫秒数，冷却结束转半开（1-600000，默认 30000）
  halfOpenProbes: 1         # 半开状态放行几个探测请求（1-10，默认 1）

# ── 缓存配置 ──────────────────────────────────────────────
# 图片识别结果持久化缓存（SQLite）
cache:
  maxAgeDays: 7        # 缓存过期天数（默认 7，范围 1-3650）
  maxRecords: 1000     # 最大记录数（默认 1000，范围 1-1000000）

# ── 观测指标 ──────────────────────────────────────────────
# 仪表盘顶部指标（请求数、成功率、P95）的统计窗口。
# 窗口太短会让分位数失真：低流量下 1 分钟窗口常只有个位数样本，
# 一次超时就能把 P95 拽到 30s。桶按秒分配，60 分钟约 3601 个桶。
# 累计请求总数与请求日志不受此项影响。
metrics:
  windowMinutes: 15    # 统计窗口分钟数（默认 15，范围 1-60）

# ── Provider 定义 ────────────────────────────────────────
# format: anthropic | openai
# apiKey 可选：留空则从客户端请求头中自动提取
providers:
  mimo:
    baseUrl: "https://token-plan-cn.xiaomimimo.com"
    apiKey: "sk-xxx"
    format: anthropic
    maxConcurrent: 3      # 最大并发请求数（默认 5，范围 1-100）
    maxPerSecond: 2       # 每秒最多请求数（默认 0，范围 0-100）
    maxQueueWait: 30000   # 队列最大等待毫秒（默认 30000，范围 1-600000）

  mimo_vision:
    baseUrl: "https://api.xiaomimimo.com"
    apiKey: "sk-xxx"
    format: openai
    maxConcurrent: 5
    maxPerSecond: 3
    maxQueueWait: 30000

  deepseek:
    baseUrl: "https://api.deepseek.com"
    apiKey: "sk-xxx"
    format: openai
    maxConcurrent: 5
    maxPerSecond: 3
    maxQueueWait: 30000

# ── 路由规则 ──────────────────────────────────────────────
# 按顺序匹配，第一条命中的生效
# match 支持通配符 * 和 ?
# vision 可选：配置后对纯文本 provider 自动翻译图片
routes:
  - match: "claude-3-5-sonnet*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"

  - match: "claude-3-opus*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"

  - match: "claude-3-haiku*"
    provider: deepseek
    model: "deepseek-chat"

  # 多目标写法：与上面的 provider/model 单目标写法互斥，二者只能选一种。
  # 需要 failover.enabled: true 才会在首个候选失败时往下试；否则只用第一个。
  # 候选按顺序尝试，最多 5 个；同 provider 换不同 model 也合法（降级到便宜模型）。
  #
  # strategy 可选，决定「先试谁」，与 failover 的「失败了还能试谁」正交：
  #   failover（默认）  按 targets 配置顺序，永远先试第一个
  #   round-robin       每次请求轮转起点，把流量摊到各候选上
  #   least-queue       选在途量（running+queued）最小的候选；相同时按轮转打散
  # 只能写在有 2 个及以上候选的路由上，单候选路由写了会在启动时报错。
  # round-robin / least-queue 会按可缓存前缀（system + 首条 user 消息）做 5 分钟
  # 粘性，让同一会话尽量固定在一个上游，避免上游侧 prompt cache 反复失效。
  # 注意 directMode: true 时没有队列，负载恒为 0，least-queue 会退化成 round-robin。
  # - match: "claude-sonnet-4*"
  #   strategy: round-robin
  #   targets:
  #     - provider: mimo
  #       model: "mimo-v2.5-pro"
  #     - provider: deepseek
  #       model: "deepseek-chat"

  - match: "*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"
