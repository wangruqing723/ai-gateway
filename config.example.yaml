port: 7789
# host: "127.0.0.1"     # 默认仅监听本地（Docker 环境请改为 "0.0.0.0"）

# ── 请求配置 ──────────────────────────────────────────────
timeout: 120000        # 请求超时（毫秒），默认 120 秒（1000-300000）
streamActivityTimeout: 60000   # 流式活跃超时（毫秒），流式响应超过此时间无新数据则主动断开，默认 60 秒（5000-600000）

# ── 直通模式（direct mode，可选）─────────────────────────────
# 开启后请求不进队列：跳过并发控制、限速(maxPerSecond)与排队等待(maxQueueWait)，
# 直接转发到上游。适合个人自用、希望“能发就发、被上游限额就直接返回”的场景。
# 限流由上游自己用 HTTP 429 处理（网关原样透传，不重试、不排队）。仅保留下面的超时保护。
# 默认关闭；不写这些字段即为关闭，保持队列行为。
directMode: false
# 直通模式下的三类超时（毫秒），仅 directMode: true 时生效：
directTimeoutNoStream: 60000      # 非流式：从发请求到收完整响应的整体超时，超时返回 504
directTimeoutStreamHeader: 60000  # 流式：等上游返回响应头(首字前)的超时，超时返回 504
directTimeoutStreamActive: 120000 # 流式：流已开始后，中途多久无新数据就断开（给思考/工具调用留足停顿空间）

# ── 缓存配置 ──────────────────────────────────────────────
# 图片识别结果持久化缓存（SQLite）
cache:
  maxAgeDays: 7        # 缓存过期天数（默认 7 天）
  maxRecords: 1000     # 最大记录数（默认 1000 条）

# ── Provider 定义 ────────────────────────────────────────
# format: anthropic | openai
# apiKey 可选：留空则从客户端请求头中自动提取
providers:
  mimo:
    baseUrl: "https://token-plan-cn.xiaomimimo.com"
    apiKey: "sk-xxx"
    format: anthropic
    maxConcurrent: 3      # 最大并发请求数（默认 5）
    maxPerSecond: 2       # 每秒最多请求数（默认不限制）
    maxQueueWait: 30000   # 队列最大等待时间毫秒（默认 30 秒）

  mimo_vision:
    baseUrl: "https://api.xiaomimimo.com"
    apiKey: "sk-xxx"
    format: openai
    maxConcurrent: 5
    maxPerSecond: 3
    maxQueueWait: 30000

  deepseek:
    baseUrl: "https://api.deepseek.com"
    apiKey: "sk-xxx"
    format: openai
    maxConcurrent: 5
    maxPerSecond: 3
    maxQueueWait: 30000

# ── 路由规则 ──────────────────────────────────────────────
# 按顺序匹配，第一条命中的生效
# match 支持通配符 * 和 ?
# vision 可选：配置后对纯文本 provider 自动翻译图片
routes:
  - match: "claude-3-5-sonnet*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"

  - match: "claude-3-opus*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"

  - match: "claude-3-haiku*"
    provider: deepseek
    model: "deepseek-chat"

  - match: "*"
    provider: mimo
    model: "mimo-v2.5-pro"
    vision:
      provider: mimo_vision
      model: "mimo-v2.5"
