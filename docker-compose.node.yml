# Node.js 版本归档配置（已被 Go 版本替代）
# 启动命令：docker compose -f docker-compose.node.yml up -d
services:
  gateway-node:
    # 使用 Node.js 最终版本镜像（v1.0.0-node）
    image: ghcr.io/wangruqing723/ai-gateway:1.0.0-node

    # 本地构建（如需修改 Node 版本代码）
    # build:
    #   context: .
    #   dockerfile: Dockerfile.node

    container_name: ai-gateway-node
    #restart: unless-stopped
    ports:
      - "7789:7789"
    volumes:
      # 挂载配置文件（宿主机编辑后重启容器即生效）
      - ./config.yaml:/app/config.yaml:ro
      # 持久化图片缓存
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 256M
