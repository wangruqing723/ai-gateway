services:
  gateway:
    # ── 方式一：使用 GitHub 自动构建的镜像（推荐）──
    image: ghcr.io/wangruqing723/ai-gateway:latest

    # ── 方式二：本地构建 ──────────────────────────
    #build: .
    #image: ai-gateway:local

    container_name: ai-gateway
    #restart: unless-stopped
    # 容器以宿主用户身份运行，管理页面才能写回挂载的 config.yaml。
    # 跨平台（macOS / Linux·WSL）推荐用 ./scripts/up.sh 启动：
    #   自动把本机 id -u/-g 写入 .env，并在 Linux 上对齐 config.yaml/data 属主。
    # 默认值 501:20 面向 macOS；其它机器请设置 AI_GATEWAY_UID/GID（见 .env.example）。
    user: "${AI_GATEWAY_UID:-501}:${AI_GATEWAY_GID:-20}"
    ports:
      # 只发布到本机回环：网关没有强制 gateway token，而 /api/config 能改写磁盘
      # 配置并热重载，绑所有网卡等于把配置写权限开放给整个局域网。
      # 容器内仍必须监听 0.0.0.0:7789（见 config.yaml 的 host），这里限制的是宿主侧。
      # 需要跨机器管理时用 SSH 本地端口转发，仍以 127.0.0.1 访问：
      #   ssh -N -L 7789:127.0.0.1:7789 <user>@<host>
      - "127.0.0.1:7789:7789"
    volumes:
      # 挂载配置文件；管理页面保存配置时需要写权限。
      - ./config.yaml:/app/config.yaml
      # 开发模式前端热加载目录；修改 cmd/gateway/web/index.html 后浏览器自动刷新。
      - ./cmd/gateway/web:/app/web:ro
      # 持久化数据目录（SQLite 缓存）
      - ./data:/app/data
    # 注意：这里**故意不写** extra_hosts 的 host.docker.internal 映射。
    # macOS/Windows 的 Docker Desktop 与 colima 都自带可用的 host.docker.internal；
    # 强制成 host-gateway 反而会把它覆盖成 compose 网络在虚拟机内的网桥网关
    # （如 172.23.0.1），那个地址上没有任何东西监听，代理会 connection refused。
    # 原生 Linux 默认没有该域名，需要代理的 Linux 用户自行在此加：
    #   extra_hosts:
    #     - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - AI_GATEWAY_WEB_DIR=/app/web
      # 出网代理：默认空 = 不走代理，与不设该变量等价。
      # 宿主机代理要写 host.docker.internal 而非 127.0.0.1，后者在容器里指容器自己。
      # 只在需要代理才能访问上游时才填（在 .env 里设置，见 .env.example）。
      - HTTPS_PROXY=${AI_GATEWAY_HTTPS_PROXY:-}
      - HTTP_PROXY=${AI_GATEWAY_HTTP_PROXY:-}
      # NO_PROXY 是逃生口：列在这里的目标绕过代理直连。
      # 本机回环必须排除，否则指向本地服务的 provider 会被绕去代理。
      - NO_PROXY=${AI_GATEWAY_NO_PROXY:-localhost,127.0.0.1,::1}
      - AI_GATEWAY_DEBUG_UPSTREAM_BODY=/app/data/upstream_debug.jsonl
      # 跨格式流式转换失败时落盘上游原始 SSE。只在失败时写，成功的流不落盘。
      # 排查完请清空这一行：467KB 级别的流累积起来很快。
      - AI_GATEWAY_DEBUG_UPSTREAM_STREAM=/app/data/upstream_stream.jsonl
    deploy:
      resources:
        limits:
          memory: 128M
