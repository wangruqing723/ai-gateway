services:
  gateway:
    # ── 方式一：使用 GitHub 自动构建的镜像（推荐）──
    image: ghcr.io/wangruqing723/ai-gateway:latest

    # ── 方式二：本地构建 ──────────────────────────
    #build: .
    #image: ai-gateway:local

    container_name: ai-gateway
    #restart: unless-stopped
    # 容器以宿主用户身份运行，管理页面才能写回挂载的 config.yaml。
    # 跨平台（macOS / Linux·WSL）推荐用 ./scripts/up.sh 启动：
    #   自动把本机 id -u/-g 写入 .env，并在 Linux 上对齐 config.yaml/data 属主。
    # 默认值 501:20 面向 macOS；其它机器请设置 AI_GATEWAY_UID/GID（见 .env.example）。
    user: "${AI_GATEWAY_UID:-501}:${AI_GATEWAY_GID:-20}"
    ports:
      - "7789:7789"
    volumes:
      # 挂载配置文件；管理页面保存配置时需要写权限。
      - ./config.yaml:/app/config.yaml
      # 开发模式前端热加载目录；修改 cmd/gateway/web/index.html 后浏览器自动刷新。
      - ./cmd/gateway/web:/app/web:ro
      # 持久化数据目录（SQLite 缓存）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - AI_GATEWAY_WEB_DIR=/app/web
    deploy:
      resources:
        limits:
          memory: 128M
